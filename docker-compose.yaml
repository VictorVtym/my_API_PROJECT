services:
  backend:
    build: .
    ports:
      - "8080:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy # Ждем, пока БД будет полностью готова к работе

  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_PASSWORD: "$POSTGRES_PASSWORD"
    volumes:
      - pg_data:/var/lib/postgresql  # Сохранение данных при перезапуске
    healthcheck:  # Проверка готовности БД для backend
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db} -c 'SELECT 1;'"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
